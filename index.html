<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kami 紙 · 智能排版</title>
<style>
/* ═══════════ Kami 设计系统 ═══════════ */
:root{
  --parchment:#F5F4ED;--ivory:#FAF9F5;--warm-sand:#E8E6DC;
  --deep-dark:#141413;--dark-surface:#30302E;
  --brand:#1B365D;--brand-light:#2D5A8A;
  --near-black:#141413;--dark-warm:#3D3D3A;--olive:#504e49;--stone:#6b6a64;
  --border:#E8E6DC;--border-soft:#E5E3D8;
  --tag-08:#EEF2F7;--tag-14:#E4ECF5;--tag-18:#D0DCE9;--tag-30:#D6E1EE;
  --error:#B53333;
  --ring-warm:rgba(27,54,93,0.12);
  --serif:"TsangerJinKai02","Charter","Georgia","Noto Serif SC","Songti SC",serif;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","Fira Code","SF Mono",monospace;
  --body-size:10pt;--body-line:1.55;--col-width:680px;
  --h1-size:20pt;--h1-line:1.20;--h2-size:15pt;--h2-line:1.25;
  --h3-size:12.5pt;--h3-line:1.30;--lead-size:11pt;
  --caption-size:9pt;--caption-line:1.45;--label-size:7.5pt;--label-line:1.35;
  --spacing-xs:3px;--spacing-sm:5px;--spacing-md:10px;--spacing-lg:20px;
  --spacing-xl:32px;--spacing-2xl:48px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:16px;--radius-xl:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--parchment);color:var(--near-black);font-family:var(--sans);font-size:var(--body-size);line-height:var(--body-line);font-weight:400}
body{display:flex;overflow:hidden}

/* ═══════════ 面板 ═══════════ */
.panel{width:320px;flex-shrink:0;background:var(--ivory);border-right:1px solid var(--border);padding:var(--spacing-xl) var(--spacing-lg);overflow-y:auto;display:flex;flex-direction:column;gap:var(--spacing-xl)}
.panel-header h2{font-family:var(--serif);font-size:var(--h2-size);font-weight:500;line-height:var(--h2-line);color:var(--brand);margin-bottom:2px}
.panel-header p{font-size:8pt;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:1px}
.group{display:flex;flex-direction:column;gap:var(--spacing-sm)}
.group-label{font-size:var(--label-size);font-weight:600;color:var(--olive);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.radio-row{display:flex;flex-direction:column;gap:var(--spacing-xs)}
.radio-btn{position:relative}
.radio-btn input{position:absolute;opacity:0;pointer-events:none}
.radio-btn label{display:flex;flex-direction:column;padding:8px 12px;border-radius:var(--radius-sm);font-size:9pt;cursor:pointer;background:var(--warm-sand);color:var(--olive);transition:all 0.15s;border:1px solid transparent;line-height:1.4}
.radio-btn label small{font-size:7.5pt;color:var(--stone);font-weight:400}
.radio-btn input:checked+label{background:var(--brand);color:var(--ivory)}
.radio-btn input:checked+label small{color:rgba(255,255,255,0.7)}
.range-wrap{display:flex;align-items:center;gap:var(--spacing-sm)}
.range-wrap input[type=range]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:var(--warm-sand);border-radius:2px;outline:none}
.range-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--brand);cursor:pointer;box-shadow:0 0 0 2px var(--ivory),0 0 0 3px var(--ring-warm)}

/* AI section */
.ai-section{border-top:1px dashed var(--border-soft);padding-top:var(--spacing-lg);display:flex;flex-direction:column;gap:var(--spacing-sm)}
.ai-section input{width:100%;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:8.5pt;font-family:var(--mono);background:var(--parchment);color:var(--dark-warm);outline:none}
.ai-section input:focus{border-color:var(--brand)}
.ai-btn{padding:8px 16px;border-radius:var(--radius-md);font-size:9pt;font-weight:500;cursor:pointer;border:none;font-family:var(--sans);background:var(--brand);color:var(--ivory);width:100%}
.ai-btn:hover{box-shadow:0 0 0 1pt var(--ring-warm)}
.ai-btn:disabled{opacity:.4;cursor:default}
.ai-status{font-size:8pt;color:var(--stone);min-height:3em;line-height:1.5}

/* ═══════════ 预览+分页 ═══════════ */
.preview-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.page-nav{display:flex;align-items:center;justify-content:center;gap:var(--spacing-md);padding:var(--spacing-md) var(--spacing-xl);background:var(--parchment);border-bottom:1px solid var(--border-soft);flex-shrink:0;font-size:9pt;color:var(--stone)}
.page-nav button{padding:4px 12px;border-radius:var(--radius-sm);font-size:9pt;font-weight:500;cursor:pointer;border:none;font-family:var(--sans);background:var(--warm-sand);color:var(--olive);transition:all 0.15s}
.page-nav button:hover{box-shadow:0 0 0 1pt var(--ring-warm)}
.page-nav button:disabled{opacity:0.3;cursor:default}
.preview{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:var(--spacing-2xl) var(--spacing-xl)}
.page{width:var(--col-width);max-width:100%;display:none;flex-direction:column;gap:var(--spacing-xl)}
.page.active{display:flex}

/* ── 排版层级 ── */
.display{font-family:var(--serif);font-size:42pt;font-weight:500;line-height:1.10;color:var(--brand);letter-spacing:-0.5px}
.byline{font-size:var(--caption-size);color:var(--stone);margin-top:-20px}
.h1{font-family:var(--serif);font-size:var(--h1-size);font-weight:500;line-height:var(--h1-line);color:var(--near-black)}
.h2{font-family:var(--serif);font-size:var(--h2-size);font-weight:500;line-height:var(--h2-line);color:var(--near-black)}
.h3{font-family:var(--serif);font-size:var(--h3-size);font-weight:500;line-height:var(--h3-line);color:var(--olive)}
.lead{font-size:var(--lead-size);font-weight:400;line-height:var(--body-line);color:var(--dark-warm)}
.body-text{font-size:var(--body-size);font-weight:400;line-height:var(--body-line);color:var(--near-black)}
.caption-text{font-size:var(--caption-size);line-height:var(--caption-line);color:var(--stone)}

/* ── 组件 ── */
.quote{border-left:2pt solid var(--brand);padding:var(--spacing-sm) 0 var(--spacing-sm) var(--spacing-lg);color:var(--olive);font-size:var(--body-size);line-height:var(--body-line)}
.quote cite{display:block;margin-top:var(--spacing-sm);font-size:var(--caption-size);color:var(--stone);font-style:normal}
.metric-row{display:flex;gap:var(--spacing-xl);flex-wrap:wrap}
.metric{display:flex;flex-direction:column;gap:2px}
.metric .m-num{font-family:var(--serif);font-size:28pt;font-weight:500;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.metric .m-label{font-size:var(--label-size);font-weight:600;color:var(--olive);text-transform:uppercase;letter-spacing:0.5px}
.dash-list{list-style:none;display:flex;flex-direction:column;gap:var(--spacing-sm)}
.dash-list li{padding-left:var(--spacing-lg);position:relative;font-size:var(--body-size);line-height:var(--body-line);color:var(--near-black)}
.dash-list li::before{content:'—';position:absolute;left:0;color:var(--olive)}
.code-block{background:var(--ivory);border-radius:var(--radius-sm);padding:var(--spacing-lg);font-family:var(--mono);font-size:9pt;line-height:1.55;color:var(--dark-warm);overflow-x:auto;white-space:pre}
.tag-row{display:flex;gap:var(--spacing-sm);flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:var(--radius-sm);font-size:8pt;font-weight:600;font-family:var(--sans)}
.tag-light{background:var(--tag-08);color:var(--brand)}
.tag-standard{background:var(--tag-18);color:var(--brand)}
.tag-brush{background:linear-gradient(135deg,var(--tag-14),var(--tag-30));color:var(--brand)}
.feat-card{background:var(--ivory);border-radius:var(--radius-lg);padding:var(--spacing-xl);box-shadow:0 4pt 24pt rgba(0,0,0,0.05)}
.sec-title{font-family:var(--serif);font-size:15pt;font-weight:500;color:var(--near-black)}
.divider{border:none;border-top:0.5pt dashed var(--border-soft);margin:0}
.info-strip{display:flex;gap:var(--spacing-md);align-items:center;padding:var(--spacing-sm) 0}
.info-strip .dot{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.label-text{font-size:var(--label-size);font-weight:600;line-height:var(--label-line);color:var(--olive);text-transform:uppercase;letter-spacing:0.5px}
</style>
</head>
<body>

<!-- ═══ 面板 ═══ -->
<aside class="panel">
  <div class="panel-header">
    <h2>Kami 紙</h2>
    <p>智能排版</p>
  </div>

  <!-- 导入 -->
  <div class="group">
    <span class="group-label">📄 导入文章 (.txt)</span>
    <div class="upload-zone" style="border:1pt dashed var(--border-soft);border-radius:var(--radius-md);padding:var(--spacing-md);text-align:center;cursor:pointer;background:var(--parchment)" onclick="document.getElementById('fileInput').click()">
      <p style="font-size:9pt;color:var(--stone)">点击或拖拽上传</p>
      <p class="filename" id="fileName" style="font-size:8pt;color:var(--olive);margin-top:4px"></p>
      <input type="file" style="display:none" id="fileInput" accept=".txt" onchange="handleFile(this.files[0])">
    </div>
  </div>

  <!-- 画布配置 -->
  <div class="group">
    <span class="group-label">🎨 画布配置</span>
    <div class="radio-row" id="canvasGroup">
      <div class="radio-btn"><input type="radio" name="canvas" value="parchment" checked id="c-parch"><label for="c-parch">羊皮纸 标准<small>#F5F4ED · Kami 默认底色</small></label></div>
      <div class="radio-btn"><input type="radio" name="canvas" value="print" id="c-print"><label for="c-print">打印白<small>#FFFFFF · 适配 A4 打印输出</small></label></div>
      <div class="radio-btn"><input type="radio" name="canvas" value="deep" id="c-deep"><label for="c-deep">暗夜深色<small>#141413 · 橄榄底暗黑模式</small></label></div>
      <div class="radio-btn"><input type="radio" name="canvas" value="cold" id="c-cold"><label for="c-cold">冷灰 反面示例⚠️<small>#F3F4F6 · 违反 Kami 暖调原则</small></label></div>
    </div>
  </div>

  <!-- 栏宽 -->
  <div class="group">
    <span class="group-label">📏 栏宽</span>
    <div class="range-wrap">
      <span class="label-text">窄</span>
      <input type="range" min="480" max="820" value="680" step="20" id="colWidth">
      <span class="label-text">宽</span>
    </div>
  </div>

  <!-- AI 解析 -->
  <div class="ai-section">
    <span class="group-label">🤖 AI 智能解析</span>
    <input type="password" id="apiKey" placeholder="OpenAI API Key (sk-...)">
    <input type="text" id="apiBase" placeholder="API Base (可选，默认 OpenAI)" value="">
    <input type="text" id="apiModel" placeholder="模型 (默认 gpt-4o-mini)" value="gpt-4o-mini">
    <button class="ai-btn" id="aiBtn" onclick="runAI()">分析文章结构</button>
    <div class="ai-status" id="aiStatus">识别标题、作者、章节层级，自动排版。</div>
  </div>
</aside>

<!-- ═══ 预览 ═══ -->
<div class="preview-wrap">
  <nav class="page-nav" id="pageNav">
    <button id="prevBtn" disabled>←</button>
    <span id="pageInfo">第 1 / 1 页</span>
    <button id="nextBtn" disabled>→</button>
  </nav>
  <div class="preview" id="preview">
    <div class="page active" id="page-0"></div>
  </div>
</div>

<script>
const root=document.documentElement,preview=document.getElementById('preview');
let currentText='',pages=[],currentPage=0;

// ═══════════ 完整 Kami 画布配置 ═══════════
const CANVAS_CONFIG={
  parchment:{
    '--parchment':'#F5F4ED','--ivory':'#FAF9F5','--warm-sand':'#E8E6DC',
    '--deep-dark':'#141413','--dark-surface':'#30302E',
    '--brand':'#1B365D','--brand-light':'#2D5A8A',
    '--near-black':'#141413','--dark-warm':'#3D3D3A','--olive':'#504e49','--stone':'#6b6a64',
    '--border':'#E8E6DC','--border-soft':'#E5E3D8',
    '--tag-08':'#EEF2F7','--tag-14':'#E4ECF5','--tag-18':'#D0DCE9','--tag-30':'#D6E1EE',
    '--error':'#B53333','--ring-warm':'rgba(27,54,93,0.12)',
  },
  print:{
    '--parchment':'#FFFFFF','--ivory':'#FAFAF9','--warm-sand':'#EBE9E3',
    '--deep-dark':'#141413','--dark-surface':'#30302E',
    '--brand':'#1B365D','--brand-light':'#2D5A8A',
    '--near-black':'#141413','--dark-warm':'#3D3D3A','--olive':'#504e49','--stone':'#6b6a64',
    '--border':'#E5E3D8','--border-soft':'#EDEBE6',
    '--tag-08':'#EEF2F7','--tag-14':'#E4ECF5','--tag-18':'#D0DCE9','--tag-30':'#D6E1EE',
    '--error':'#B53333','--ring-warm':'rgba(27,54,93,0.12)',
  },
  deep:{
    '--parchment':'#141413','--ivory':'#30302E','--warm-sand':'#3D3D3A',
    '--deep-dark':'#141413','--dark-surface':'#30302E',
    '--brand':'#5B8CC7','--brand-light':'#7AA9DD',
    '--near-black':'#E8E6DC','--dark-warm':'#CCC8BE','--olive':'#B5B0A5','--stone':'#969186',
    '--border':'#3D3D3A','--border-soft':'#4A4945',
    '--tag-08':'#2A3244','--tag-14':'#2F3B52','--tag-18':'#354560','--tag-30':'#3E5070',
    '--error':'#CC5555','--ring-warm':'rgba(91,140,199,0.18)',
  },
  cold:{
    '--parchment':'#F3F4F6','--ivory':'#FAFAFA','--warm-sand':'#E5E7EB',
    '--deep-dark':'#1F2937','--dark-surface':'#374151',
    '--brand':'#3B82F6','--brand-light':'#60A5FA',
    '--near-black':'#111827','--dark-warm':'#374151','--olive':'#6B7280','--stone':'#9CA3AF',
    '--border':'#E5E7EB','--border-soft':'#D1D5DB',
    '--tag-08':'#DBEAFE','--tag-14':'#BFDBFE','--tag-18':'#93C5FD','--tag-30':'#60A5FA',
    '--error':'#EF4444','--ring-warm':'rgba(59,130,246,0.14)',
  }
};

function applyCanvas(mode){
  const cfg=CANVAS_CONFIG[mode];
  Object.entries(cfg).forEach(([k,v])=>root.style.setProperty(k,v));
  preview.style.background='var(--parchment)';
  document.querySelector('.panel').style.background='var(--ivory)';
  document.querySelector('.page-nav').style.background='var(--parchment)';
  root.style.color='var(--near-black)';
}

document.querySelectorAll('input[name=canvas]').forEach(r=>r.onchange=function(){
  applyCanvas(this.value);
});

// ═══ 栏宽 ═══
document.getElementById('colWidth').oninput=function(){
  root.style.setProperty('--col-width',this.value+'px');
};

// ═══════════ DEFAULT ═══════════
const DEFAULT_TEXT=`# 好内容，值得好版面

暖米纸底，油墨蓝点缀，serif 承担层级，硬阴影与花哨配色都退后。这套系统面向印刷文档，负责把内容收束成稳定、清晰、易读的版面。

## 设计原则

## 一种强调色，一套排版规则

Kami 的核心约束很简单：页面背景用羊皮纸 #f5f4ed，不用纯白；强调色只有油墨蓝一种，不引入第二种彩色；所有灰色都是暖调，禁止冷蓝灰；英文 serif 通吃标题和正文，中文标题用 serif、正文用 sans。

Serif 正文始终保持 400 字重，标题 500，不用合成 bold。需要更强存在感时，用字号或品牌色左侧竖线，不靠合成粗体。

> 一千个 no 换一个 yes，宁可清淡，不可浓艳。

## 暖调克制

唯一强调色、纯暖调中性灰、零冷色。油墨蓝全文档不超过 5% 面积，超过就从克制变成堆砌。所有灰色都有暖黄底色，R ≈ G > B 是基本规律。

* 极淡 0.08, 标准 0.18, 笔刷渐变

### Tag Tints · 实色对照

Tag 背景必须使用实色 hex，禁止 rgba()——这是为了避免 WeasyPrint 在 PDF 导出时出现双层矩形渲染问题。

---

- 暖米纸底，不用纯白
- 油墨蓝点缀，不引第二色
- Serif 承担权威
- Ring shadow 取代硬投影

## 节奏与形

基础单位 4pt，密度越高 margin 越小，场合越正式 margin 越大。圆角从 4pt 到 32pt 共七级，阴影只用 ring shadow、whisper shadow 与明暗交替。

\`\`\`
// 暖米纸 · 一种克制的温度
canvas   = parchment; accent = ink_blue
palette  = warm_neutrals − cool_grays
document = serif × hierarchy + generous_space
beauty   = constraints × intention ÷ noise
\`\`\`

▲ Kami 设计哲学，用等宽字体呈现，ivory 底色 + 4pt 圆角，无边框。`;

currentText=DEFAULT_TEXT;

// ═══════════ PARSER ═══════════
function parseText(text){
  const lines=text.split('\n'),blocks=[];
  let i=0;
  while(i<lines.length){
    let line=lines[i].trim();
    if(!line){i++;continue}
    if(line.startsWith('# ')&&!line.startsWith('## ')){blocks.push({type:'display',text:line.slice(2)});i++;continue}
    if(line.startsWith('## ')&&!line.startsWith('### ')){blocks.push({type:'h1',text:line.slice(3)});i++;continue}
    if(line.startsWith('### ')){blocks.push({type:'h2',text:line.slice(4)});i++;continue}
    if(line.startsWith('> ')){blocks.push({type:'quote',text:line.slice(2)});i++;continue}
    if(line.startsWith('* ')&&line.includes(',')){const tags=line.slice(2).split(',').map(t=>t.trim()).filter(Boolean);if(tags.length>=2){blocks.push({type:'tags',tags});i++;continue}}
    if(line.startsWith('- ')){const items=[];while(i<lines.length&&lines[i].trim().startsWith('- ')){items.push(lines[i].trim().slice(2));i++;}blocks.push({type:'dash-list',items});continue}
    if(line.startsWith('```')){const codeLines=[];i++;while(i<lines.length&&!lines[i].trim().startsWith('```')){codeLines.push(lines[i]);i++;}blocks.push({type:'code',text:codeLines.join('\n')});i++;continue}
    if(line==='---'){blocks.push({type:'divider'});i++;continue}
    if(line.startsWith('▲ ')){blocks.push({type:'caption',text:line.slice(1).trim()});i++;continue}
    if(line.startsWith('## ')){blocks.push({type:'sec-title',text:line.slice(3)});i++;continue}
    const paraLines=[];while(i<lines.length&&lines[i].trim()&&!lines[i].trim().match(/^(#|>|```|\* |- |---|▲)/)){paraLines.push(lines[i].trim());i++;}
    if(paraLines.length){blocks.push({type:'body',text:paraLines.join('\n')})}
  }
  return blocks;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function blockToHTML(b,author,date){
  switch(b.type){
    case 'display':
      let h=`<h1 class="display">${esc(b.text)}</h1>`;
      if(author||date)h+=`<div class="byline">${[author,date].filter(Boolean).join(' · ')}</div>`;
      return h;
    case 'sec-title':return `<div class="sec-title">${esc(b.text)}</div>`;
    case 'h1':return `<h2 class="h1">${esc(b.text)}</h2>`;
    case 'h2':return `<h3 class="h2">${esc(b.text)}</h3>`;
    case 'h3':return `<h3 class="h3">${esc(b.text)}</h3>`;
    case 'quote':return `<blockquote class="quote">${esc(b.text)}</blockquote>`;
    case 'body':return `<p class="body-text">${esc(b.text)}</p>`;
    case 'caption':return `<span class="caption-text">${esc(b.text)}</span>`;
    case 'divider':return '<hr class="divider">';
    case 'tags':return `<div class="tag-row">${b.tags.map((t,i)=>`<span class="tag tag-${i===0?'light':i===1?'standard':'brush'}">${esc(t)}</span>`).join('')}</div>`;
    case 'dash-list':return `<ul class="dash-list">${b.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
    case 'code':return `<pre class="code-block">${esc(b.text)}</pre>`;
    default:return '';
  }
}

// ═══ 分页 ═══
function renderPages(){
  if(window._aiMeta){
    return renderWithMeta();
  }
  return renderFromText();
}

function renderFromText(){
  const blocks=parseText(currentText);
  window._blocks=blocks;
  return doRender(blocks);
}

function renderWithMeta(){
  const blocks=window._aiMeta.blocks;
  window._blocks=blocks;
  const meta=window._aiMeta;
  return doRender(blocks,meta.author,meta.date);
}

function doRender(blocks,author,date){
  const perPage=6,pageCount=Math.max(1,Math.ceil(blocks.length/perPage));
  pages=[];
  for(let p=0;p<pageCount;p++){
    const start=p*perPage,end=Math.min(start+perPage,blocks.length);
    const slice=blocks.slice(start,end);
    const html=slice.map(b=>{
      if(b.type==='display')return blockToHTML(b,author,date);
      if(b.type==='lead')return `<p class="lead">${esc(b.text)}</p>`;
      return blockToHTML(b);
    }).join('\n');
    pages.push(html);
  }
  currentPage=0;
  preview.innerHTML=pages.map((html,i)=>`<div class="page${i===0?' active':''}" id="page-${i}">${html}</div>`).join('');
  updatePageNav();
}

function goToPage(n){
  if(n<0||n>=pages.length)return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+n).classList.add('active');
  currentPage=n;preview.scrollTop=0;updatePageNav();
}
function updatePageNav(){
  document.getElementById('prevBtn').disabled=currentPage===0;
  document.getElementById('nextBtn').disabled=currentPage===pages.length-1;
  document.getElementById('pageInfo').textContent=`第 ${currentPage+1} / ${pages.length} 页`;
}
document.getElementById('prevBtn').onclick=()=>goToPage(currentPage-1);
document.getElementById('nextBtn').onclick=()=>goToPage(currentPage+1);

// ═══ 键盘翻页 ═══
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')goToPage(currentPage-1);
  if(e.key==='ArrowRight')goToPage(currentPage+1);
});

// ═══════════ AI 解析 ═══════════
async function runAI(){
  const key=document.getElementById('apiKey').value.trim();
  if(!key)return setStatus('请先填写 API Key');
  const base=document.getElementById('apiBase').value.trim()||'https://api.openai.com/v1';
  const model=document.getElementById('apiModel').value.trim()||'gpt-4o-mini';
  if(!currentText||currentText===DEFAULT_TEXT)return setStatus('请先导入你自己的文章');

  setStatus('正在分析…');
  document.getElementById('aiBtn').disabled=true;

  try{
    const res=await fetch(base+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({
        model,
        temperature:0.1,
        messages:[{
          role:'system',
          content:`你是一个文章结构分析器。分析用户输入的文章文本，提取结构信息。

返回严格的 JSON 格式（不要任何额外文字）：

{
  "title": "文章主标题",
  "author": "作者名（如果没有则为空字符串）",
  "date": "日期（如果没有则为空字符串）",
  "tags": ["标签1","标签2"],
  "lead": "引导语/摘要（如果没有则为空字符串）",
  "blocks": [
    {"type":"h1","text":"一级标题"},
    {"type":"body","text":"正文段落，保持原文内容"},
    {"type":"h2","text":"二级标题"},
    {"type":"body","text":"正文段落"},
    {"type":"quote","text":"引用内容"},
    {"type":"h3","text":"三级标题"},
    {"type":"body","text":"正文段落"}
  ]
}

规则：
- body 块的 text 保持原文内容，不要改写
- 根据内容语义判断标题层级，而不是机械按数字前缀
- 如果原文有引言/摘要，放到 lead 字段
- tags 提取 2-5 个关键词标签
- 只返回 JSON，不要 markdown 代码块包裹`
        },{
          role:'user',
          content:currentText
        }]
      })
    });

    if(!res.ok)throw new Error(`${res.status} ${res.statusText}`);

    const data=await res.json();
    let content=data.choices[0].message.content;

    // Strip markdown code fences if present
    content=content.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();

    const parsed=JSON.parse(content);

    // Convert to blocks format
    const meta=parsed;
    const newBlocks=[];
    let hasMeta=false;
    if(meta.title){newBlocks.push({type:'display',text:meta.title});hasMeta=true;}
    if(meta.author||meta.date){
      // We'll pass these to the display renderer
    }
    if(meta.lead){newBlocks.push({type:'lead',text:meta.lead})}
    if(meta.tags&&meta.tags.length){
      newBlocks.push({type:'tags',tags:meta.tags.slice(0,5)});
    }
    if(meta.blocks&&meta.blocks.length){
      newBlocks.push(...meta.blocks);
    }

    // Save AI metadata and rerender
    window._aiMeta={author:meta.author,date:meta.date,blocks:newBlocks};
    currentText=blocksToText(newBlocks);
    renderPages();

    setStatus(`✅ 识别完成：${newBlocks.length} 个内容块，${Math.max(1,Math.ceil(newBlocks.length/6))} 页`);
  }catch(e){
    setStatus(`❌ ${e.message}`);
  }finally{
    document.getElementById('aiBtn').disabled=false;
  }
}

function blocksToText(blocks){
  return blocks.map(b=>{
    switch(b.type){
      case'display':return'# '+b.text;
      case'h1':return'## '+b.text;
      case'h2':return'### '+b.text;
      case'h3':return'#### '+b.text;
      case'quote':return'> '+b.text;
      case'lead':return b.text;
      case'body':return b.text;
      case'dash-list':return b.items.map(i=>'- '+i).join('\n');
      case'code':return '```\n'+b.text+'\n```';
      case'tags':return '* '+b.tags.join(', ');
      default:return b.text||'';
    }
  }).join('\n\n');
}

function renderPagesWithMeta(meta){
  const blocks=meta.pages;
  const perPage=6,pageCount=Math.max(1,Math.ceil(blocks.length/perPage));
  pages=[];
  for(let p=0;p<pageCount;p++){
    const start=p*perPage,end=Math.min(start+perPage,blocks.length);
    const slice=blocks.slice(start,end);
    const html=slice.map((b,i)=>{
      if(b.type==='display')return blockToHTML(b,meta.author,meta.date);
      if(b.type==='lead')return `<p class="lead">${esc(b.text)}</p>`;
      return blockToHTML(b);
    }).join('\n');
    pages.push(html);
  }
  currentPage=0;
  preview.innerHTML=pages.map((html,i)=>`<div class="page${i===0?' active':''}" id="page-${i}">${html}</div>`).join('');
  updatePageNav();
}

function setStatus(m){document.getElementById('aiStatus').textContent=m}

// ═══ 文件导入 ═══
function handleFile(file){
  if(!file||!file.name.endsWith('.txt'))return;
  const reader=new FileReader();
  reader.onload=function(){
    currentText=reader.result;
    window._aiMeta=null;
    document.getElementById('fileName').textContent='📎 '+file.name;
    document.getElementById('aiStatus').textContent='已导入，可点击「分析文章结构」';
    renderPages();
  };
  reader.readAsText(file,'UTF-8');
}

// upload zone drag support
(function(){
  const zone=document.querySelector('.upload-zone');
  if(!zone)return;
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.style.borderColor='var(--brand)'});
  zone.addEventListener('dragleave',()=>zone.style.borderColor='');
  zone.addEventListener('drop',e=>{e.preventDefault();zone.style.borderColor='';handleFile(e.dataTransfer.files[0])});
})();

// ═══ init ═══
renderPages();
</script>
